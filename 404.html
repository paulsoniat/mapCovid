<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Page not found - MapCovid" />
    <title>404 — Page Not Found | MapCovid</title>
    <style>
      /* Dark theme styles matching the site's grayscale aesthetic */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #1a1a1a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }

      .container {
        max-width: 600px;
        width: 100%;
      }

      .error-code {
        font-size: 8rem;
        font-weight: 700;
        line-height: 1;
        color: #cccccc;
        letter-spacing: -0.05em;
        margin-bottom: 1rem;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }

      .divider {
        width: 60px;
        height: 3px;
        background-color: #555555;
        margin: 1.5rem auto;
        border-radius: 2px;
      }

      .heading {
        font-size: 2rem;
        font-weight: 600;
        color: #e0e0e0;
        margin-bottom: 1rem;
        letter-spacing: 0.02em;
      }

      .message {
        font-size: 1.1rem;
        color: #aaaaaa;
        line-height: 1.6;
        margin-bottom: 2.5rem;
      }

      .home-link {
        display: inline-block;
        padding: 0.75rem 2rem;
        background-color: #333333;
        color: #f5f5f5;
        text-decoration: none;
        border-radius: 4px;
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        border: 1px solid #555555;
        transition: background-color 0.2s ease, border-color 0.2s ease,
          color 0.2s ease;
      }

      .home-link:hover,
      .home-link:focus {
        background-color: #444444;
        border-color: #888888;
        color: #ffffff;
        outline: none;
      }

      .home-link:active {
        background-color: #2a2a2a;
      }

      .icon {
        font-size: 3rem;
        margin-bottom: 1rem;
        display: block;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="icon" aria-hidden="true">&#128269;</span>
      <div class="error-code">404</div>
      <div class="divider"></div>
      <h1 class="heading">Page Not Found</h1>
      <p class="message">
        The page you&rsquo;re looking for doesn&rsquo;t exist.<br />
        It may have been moved, deleted, or never existed.
      </p>
      <a class="home-link" href="index.html">&#8592;&nbsp; Back to Home</a>
    </div>
  </body>
</html>
